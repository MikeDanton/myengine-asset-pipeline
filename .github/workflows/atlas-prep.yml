name: Deterministic sprite atlas

on:
  pull_request:
    paths:
      - 'tools/atlasprep.py'
      - 'tools/assetprep.py'
      - 'tests/test_atlasprep.py'
      - 'docs/ATLAS_WORKFLOW.md'
      - '.github/workflows/atlas-prep.yml'
  push:
    branches: [main]
    paths:
      - 'tools/atlasprep.py'
      - 'tools/assetprep.py'
      - 'tests/test_atlasprep.py'
      - '.github/workflows/atlas-prep.yml'

permissions:
  contents: read

jobs:
  atlasprep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned offline image authoring dependency
        run: python -m pip install Pillow==12.0.0
      - name: Run atlas processor regression tests
        run: python -m unittest discover -s tests -p test_atlasprep.py -v
