name: Candidate visual review

on:
  pull_request:
    paths:
      - 'tools/candidate_review.py'
      - 'tests/test_candidate_review.py'
      - 'docs/CANDIDATE_REVIEW.md'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/candidate-review.yml'
  push:
    branches: [main]
    paths:
      - 'tools/candidate_review.py'
      - 'tests/test_candidate_review.py'
      - '.github/workflows/candidate-review.yml'

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned preview decoder
        run: python -m pip install Pillow==12.0.0
      - name: Run offline generation and contact-sheet tests
        run: |
          python -m unittest discover -s tests -p 'test_assetgenerate.py' -v
          python -m unittest discover -s tests -p 'test_candidate_review.py' -v
      - name: Compile authoring scripts
        run: python -m py_compile tools/assetgenerate.py tools/candidate_review.py tests/test_candidate_review.py
