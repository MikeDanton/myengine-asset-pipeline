name: Generation candidate safety

on:
  pull_request:
    paths:
      - 'tools/assetgenerate.py'
      - 'tools/assetprep.py'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'tools/assetc/CMakeLists.txt'
      - 'tools/assetc/main.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/generation-candidates.yml'
      - 'tests/test_assetgenerate.py'
      - 'tests/test_assetc.py'
      - 'tests/*.cpp'
      - 'tests/CMakeLists.txt'
  push:
    branches: [main]
    paths:
      - 'tools/assetgenerate.py'
      - 'tools/assetprep.py'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'tools/assetc/CMakeLists.txt'
      - 'tools/assetc/main.cpp'
      - 'CMakeLists.txt'
      - 'tests/test_assetgenerate.py'
      - 'tests/test_assetc.py'
      - 'tests/*.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/generation-candidates.yml'

permissions:
  contents: read

jobs:
  offline-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test provider contract, generation budgets and quarantine
        run: python3 -m unittest discover -s tests -p 'test_assetgenerate.py' -v
      - name: Python compile check
        run: python3 -m py_compile tools/assetgenerate.py tests/test_assetgenerate.py

  packer-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled C++ build tools
        run: cmake --version && ninja --version
      - name: Configure standalone packer with Clang
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DASSET_PIPELINE_WITH_ZSTD=OFF
      - name: Build C++ asset compiler and pak runtime tests
        run: cmake --build build --parallel 4
      - name: Test pak runtime and asset compiler quarantine contracts
        run: ctest --test-dir build --output-on-failure --parallel 4 -R '^(pak_.*|assetc_regressions)
